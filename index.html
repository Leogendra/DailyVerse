<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Verse</title>
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.png" />
    <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
    <header>
        <span class="logo">Daily Verse v1.1</span>
        <div class="header-right">
            <a class="btn btn-ghost" id="nav-toggle" href="#dailyrush">Dailyrush</a>
        </div>
    </header>

    <main id="app" style="display:none">
        <section class="view view-daily" id="view-daily">
            <p class="kicker">Today's daily game - <span class="date-label" id="daily-date"></span></p>

            <div class="card">
                <div class="card-meta">
                    <span class="badge" id="g-cat"></span>
                    <span class="game-id" id="g-id"></span>
                </div>
                <h1 class="game-name" id="g-name"></h1>
                <p class="game-desc" id="g-desc"></p>
                <div class="divider"></div>
                <div class="actions">
                    <button class="btn btn-primary" id="btn-play">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        Play
                    </button>
                </div>
            </div>

            <div class="or-row">
                <hr><span>or</span>
                <hr>
            </div>

            <div class="center-row">
                <button class="btn btn-ghost" id="btn-random">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 3 21 3 21 8" />
                        <line x1="4" y1="20" x2="21" y2="3" />
                        <polyline points="21 16 21 21 16 21" />
                        <line x1="4" y1="4" x2="9" y2="9" />
                    </svg>
                    Surprise me
                </button>
            </div>
        </section>

        <section class="view view-rush" id="view-rush" hidden>
            <p class="kicker">Dailyrush</p>
            <p class="rush-progress" id="rush-progress"></p>
            <ol class="rush-list" id="rush-list"></ol>

            <div class="rush-results">
                <label class="kicker" for="rush-results">Results</label>
                <textarea class="rush-results-input" id="rush-results" rows="10" spellcheck="false"
                    placeholder="Paste each game's shared result here"></textarea>
                <div class="actions">
                    <button class="btn btn-primary" id="btn-copy-results" type="button">Copy results</button>
                </div>
            </div>
        </section>
    </main>

    <p id="loading">Loading…</p>

    <footer id="footer" style="display:none">
        720 daily games &nbsp;·&nbsp;
        source: <a href="https://dles.aukspot.com" target="_blank">dles.aukspot.com</a>
    </footer>

    <script type="module" src="scripts/main.js"></script>
</body>

</html>
