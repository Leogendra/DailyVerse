<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Verse</title>
    <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
    <header>
        <span class="logo">Daily Verse v0.1</span>
        <span class="date-label" id="hdr-date"></span>
    </header>

    <main id="app" style="display:none">
        <p class="kicker">Today's daily game</p>

        <div class="card">
            <div class="card-meta">
                <span class="badge" id="g-cat"></span>
                <span class="game-id" id="g-id"></span>
            </div>
            <h1 class="game-name" id="g-name"></h1>
            <p class="game-desc" id="g-desc"></p>
            <div class="divider"></div>
            <div class="actions">
                <button class="btn btn-primary" id="btn-play">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    Play
                </button>
                <button class="btn btn-ghost" id="btn-window">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <path d="M3 9h18" />
                    </svg>
                    Window
                </button>
            </div>
        </div>

        <div class="or-row">
            <hr><span>or</span>
            <hr>
        </div>

        <div class="center-row">
            <button class="btn btn-ghost" id="btn-random" style="font-size:0.78rem">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 3 21 3 21 8" />
                    <line x1="4" y1="20" x2="21" y2="3" />
                    <polyline points="21 16 21 21 16 21" />
                    <line x1="4" y1="4" x2="9" y2="9" />
                </svg>
                Surprise me
            </button>
        </div>
    </main>

    <p id="loading">Loading…</p>

    <footer id="footer" style="display:none">
        720 daily games &nbsp;·&nbsp;
        source: <a href="https://dles.aukspot.com" target="_blank">dles.aukspot.com</a>
    </footer>

    <div id="win-layer"></div>

    <script>
        let games = [];
        let zTop = 200;
        let winSeq = 0;

        // ── Deterministic daily pick ───────────────────────────
        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function fnv32(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h;
        }

        function dailyIndex(list) {
            return fnv32(todayKey()) % list.length;
        }

        // ── Floating window ────────────────────────────────────
        function openWindow(url, name) {
            const layer = document.getElementById('win-layer');
            winSeq++;

            const vw = window.innerWidth, vh = window.innerHeight;
            const w = Math.max(340, Math.min(vw * 0.62, 760));
            const h = Math.max(280, Math.min(vh * 0.72, 580));
            const stagger = ((winSeq - 1) % 6) * 28;
            const left = Math.min(60 + stagger, vw - w - 16);
            const top = Math.min(80 + stagger, vh - h - 16);

            const el = document.createElement('div');
            el.className = 'gwin';
            el.style.cssText = `width:${w}px;height:${h}px;left:${left}px;top:${top}px;z-index:${++zTop}`;

            // Escape name for HTML attribute safety
            const safeName = name.replace(/"/g, '&quot;');

            el.innerHTML = `
        <div class="gwin-bar">
          <span class="dot dot-r" title="Close"></span>
          <span class="dot dot-y"></span>
          <span class="dot dot-g" title="Open in new tab"></span>
          <span class="gwin-title">${safeName}</span>
          <a class="gwin-ext" href="${url}" target="_blank" title="Open in new tab">↗</a>
        </div>
        <iframe src="${url}" title="${safeName}"
          sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin">
        </iframe>
      `;

            layer.appendChild(el);
            makeDraggable(el);

            el.querySelector('.dot-r').onclick = () => el.remove();
            el.querySelector('.dot-g').onclick = () => window.open(url, '_blank');
            el.addEventListener('mousedown', () => { el.style.zIndex = ++zTop; });
        }

        // ── Drag ──────────────────────────────────────────────
        function makeDraggable(el) {
            const bar = el.querySelector('.gwin-bar');
            bar.addEventListener('mousedown', e => {
                if (e.target.classList.contains('dot') || e.target.tagName === 'A') return;
                e.preventDefault();
                const rect = el.getBoundingClientRect();
                const ox = e.clientX - rect.left;
                const oy = e.clientY - rect.top;
                const onMove = e => {
                    el.style.left = (e.clientX - ox) + 'px';
                    el.style.top = (e.clientY - oy) + 'px';
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // ── Render current game into card ──────────────────────
        function renderGame(g) {
            document.getElementById('g-name').textContent = g.name;
            document.getElementById('g-cat').textContent = g.category;
            document.getElementById('g-desc').textContent = g.description || '';
            document.getElementById('g-id').textContent = `#${g.id}`;
            document.getElementById('btn-play').dataset.url = g.url;
            document.getElementById('btn-window').dataset.url = g.url;
            document.getElementById('btn-window').dataset.name = g.name;
        }

        // ── Boot ──────────────────────────────────────────────
        (async () => {
            // Format date header
            document.getElementById('hdr-date').textContent =
                new Date().toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });

            try {
                const res = await fetch('./daily_list.json');
                games = await res.json();
            } catch {
                document.getElementById('loading').textContent = 'Could not load game list.';
                return;
            }

            const dailyGame = games[dailyIndex(games)];
            renderGame(dailyGame);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('footer').style.display = 'block';

            // Play → new tab
            document.getElementById('btn-play').addEventListener('click', e => {
                window.open(e.currentTarget.dataset.url, '_blank');
            });

            // Window → floating iframe
            document.getElementById('btn-window').addEventListener('click', e => {
                const { url, name } = e.currentTarget.dataset;
                openWindow(url, name);
            });

            // Surprise me → random game (different from today's pick)
            document.getElementById('btn-random').addEventListener('click', () => {
                const todayIdx = dailyIndex(games);
                let idx;
                do { idx = Math.floor(Math.random() * games.length); }
                while (idx === todayIdx);
                const g = games[idx];
                openWindow(g.url, g.name);
            });
        })();
    </script>
</body>

</html>
